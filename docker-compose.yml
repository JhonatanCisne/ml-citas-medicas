services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-clinica_ml}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend_clinica/db/init:/docker-entrypoint-initdb.d:ro
    # Sin "ports": el backend habla con este contenedor por la red interna de
    # Docker (host "db"). Si necesitás conectarte desde fuera con un cliente
    # SQL, agregá "ports: [\"5433:5432\"]" (5432 puede chocar con un Postgres
    # local ya instalado en la máquina).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-clinica_ml}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend_clinica
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-local-clinica-secret}
      DEBUG: ${DEBUG:-False}
      DB_NAME: ${DB_NAME:-clinica_ml}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_HOST: db
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-dev-local-jwt-clinica}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    volumes:
      # CSV que deja el proyecto de ML (aparte, no forma parte de esta imagen)
      # al reentrenar. Montado como volumen para no tener que reconstruir la
      # imagen del backend cada vez que se genera una recomendacion nueva.
      - ./backend_clinica/ml_recomendaciones:/app/ml_recomendaciones:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./prototipoNav/CI/clinica-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  db_data:
